name: Weekly Newsfeed

on:
  schedule:
    - cron: '0 15 * * 1'  # Monday 8AM PDT (UTC-7)
  workflow_dispatch:        # lets you trigger it manually to test

permissions:
  contents: write  # needed to commit the archived report back to the repo

jobs:
  send-newsfeed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsfeed script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/newsfeed.py

      - name: Commit archived report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --staged --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Archive newsfeed $(date -u +%Y-%m-%d)"
            git push
          fi
